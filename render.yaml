services:
  - type: web
    name: media-sequencer-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CYCLE_MS
        value: "18000000"
      - key: SYNC_LEAD_MS
        value: "1500"
      - key: SEED_ON_START
        value: "true"
